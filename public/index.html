<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trayectia — Reservas y Control de Emisión</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 960px;
      margin: 28px auto;
      padding: 0 16px;
      background: #eef2f6;
      color: #0f172a;
      line-height: 1.45;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 12px;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 28px; color: #0f172a; }
    .pill {
      background: #dbeafe;
      color: #1e40af;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .banner {
      background: #fef3c7;
      border: 1px solid #f59e0b;
      color: #78350f;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 18px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .card h3 { margin: 0; font-size: 17px; }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
      align-items: center;
    }
    input[type="text"],
    input[type="number"],
    input:not([type]) {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #94a3b8;
      border-radius: 8px;
      font-size: 14px;
      background: #f8fafc;
      color: #0f172a;
    }
    .check-box {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 500;
      padding: 6px 4px;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    button {
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: #0284c7;
      color: #ffffff;
    }
    button:hover { background: #0369a1; }
    button.ghost { background: #e2e8f0; color: #0f172a; }
    button.ghost:hover { background: #cbd5e1; }
    button.dark { background: #0f172a; color: #ffffff; }
    button.dark:hover { background: #1e293b; }
    button.success { background: #15803d; color: #ffffff; }
    button.success:hover { background: #166534; }
    .reserva {
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .reserva-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .pend { background: #e0f2fe; color: #0369a1; }
    .ok { background: #dcfce7; color: #15803d; }
    .alerta { background: #fee2e2; color: #b91c1c; }
    .grid-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      margin-bottom: 10px;
    }
    .stat span { display: block; color: #64748b; font-size: 11px; }
    .stat strong { color: #0f172a; font-size: 13px; }
    .validar-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .validar-row input { width: 170px; }
    .hint { font-size: 12px; color: #475569; }
  </style>
</head>
<body>
  <div class="top-bar">
    <h1>Trayectia</h1>
    <span class="pill">Control de Reservas y Emisión</span>
  </div>

  <div class="banner">
    <strong>Entorno de prueba:</strong> Los cálculos (fee, recargo Addi 7,735% efectivo, $8.000 operativos y 15% fundación) y la cola de emisión son para validación; la emisión real se gestiona por canal B2B.
  </div>

  <div class="card">
    <div class="card-header">
      <h3>Nueva reserva (Snapshot)</h3>
      <button type="button" class="ghost" onclick="llenarEjemplo()">Llenar ejemplo rápido</button>
    </div>
    <form id="formReserva">
      <div class="form-grid">
        <input id="pasajero" placeholder="Nombre pasajero" required />
        <input id="ruta" placeholder="Ruta (ej. BOG - MDE)" required />
        <input id="tarifaBase" type="number" placeholder="Tarifa base COP" required />
        <label class="check-box">
          <input id="usarAddi" type="checkbox" checked /> Financiación Addi
        </label>
      </div>
      <div class="actions">
        <button type="submit">Crear reserva</button>
      </div>
    </form>
  </div>

  <div class="card">
    <div class="card-header">
      <h3>Cola de reservas</h3>
      <button type="button" class="ghost" onclick="cargarReservas()">Actualizar lista</button>
    </div>
    <div id="lista"></div>
  </div>

  <script>
    function fmt(n) {
      return "$" + Number(n || 0).toLocaleString("es-CO");
    }

    function llenarEjemplo() {
      document.getElementById("pasajero").value = "Camilo Serna";
      document.getElementById("ruta").value = "BOG - MDE";
      document.getElementById("tarifaBase").value = "220000";
      document.getElementById("usarAddi").checked = true;
    }

    async function cargarReservas() {
      const res = await fetch("/api/reservas");
      const data = await res.json();
      const el = document.getElementById("lista");
      if (!data.length) {
        el.innerHTML = '<p class="hint">No hay reservas registradas aún.</p>';
        return;
      }
      el.innerHTML = data.map(r => {
        const badgeClass = r.estado === "ALERTA_VARIACION_TARIFA" ? "alerta" : (r.estado === "EMITIDO" ? "ok" : "pend");
        const topeSubida = r.snapshot.tarifaBase + r.snapshot.toleranciaPermitida;
        return `
          <div class="reserva">
            <div class="reserva-head">
              <div>
                <strong>${r.pnr}</strong> — ${r.pasajero} <strong>(${r.ruta})</strong>
              </div>
              <span class="badge ${badgeClass}">${r.estado}</span>
            </div>

            <div class="grid-stats">
              <div class="stat"><span>Tarifa base</span><strong>${fmt(r.snapshot.tarifaBase)}</strong></div>
              <div class="stat"><span>Fee agencia</span><strong>${fmt(r.snapshot.fee)}</strong></div>
              <div class="stat"><span>Recargo Addi</span><strong>${fmt(r.snapshot.recargoAddi)}</strong></div>
              <div class="stat"><span>Total cliente</span><strong>${fmt(r.snapshot.totalCliente)}</strong></div>
              <div class="stat"><span>Fundación (15%)</span><strong>${fmt(r.snapshot.aporteFundacion)}</strong></div>
              <div class="stat"><span>Est. neto</span><strong>${fmt(r.snapshot.utilidadNetaEstimada)}</strong></div>
            </div>

            <div class="validar-row">
              <input type="number" id="val-${r.pnr}" placeholder="Tarifa actual COP" value="${r.tarifaActualValidada}" />
              <button type="button" class="dark" onclick="validar('${r.pnr}')">Validar tarifa</button>
              <button type="button" class="success" onclick="emitir('${r.pnr}')">Marcar emitido</button>
              <span class="hint">Tolerancia subida: hasta <strong>${fmt(r.snapshot.toleranciaPermitida)}</strong> (máx. ${fmt(topeSubida)})</span>
            </div>
            ${r.codigoAerolinea ? `<div class="hint" style="margin-top:8px;">Código aerolínea / PNR: <strong>${r.codigoAerolinea}</strong></div>` : ""}
          </div>
        `;
      }).join("");
    }

    document.getElementById("formReserva").addEventListener("submit", async (e) => {
      e.preventDefault();
      await fetch("/api/reservas", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          pasajero: document.getElementById("pasajero").value,
          ruta: document.getElementById("ruta").value,
          tarifaBase: Number(document.getElementById("tarifaBase").value),
          usarAddi: document.getElementById("usarAddi").checked
        })
      });
      e.target.reset();
      document.getElementById("usarAddi").checked = true;
      cargarReservas();
    });

    async function validar(pnr) {
      const tarifaActual = Number(document.getElementById("val-" + pnr).value);
      await fetch(`/api/reservas/${pnr}/validar-emision`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tarifaActual })
      });
      cargarReservas();
    }

    async function emitir(pnr) {
      const res = await fetch(`/api/reservas/${pnr}/emitir`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({})
      });
      const data = await res.json();
      if (!res.ok) alert(data.error || "No se pudo emitir");
      cargarReservas();
    }

    cargarReservas();
  </script>
</body>
</html>
